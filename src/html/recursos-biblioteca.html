<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursos Biblioteca - NexoU</title>

    <link rel="stylesheet" href="/src/css/recursos-biblioteca.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <aside class="menu-lateral">
      <header class="menu-lateral-cabecera">
        <img
          src="/src/images/logo-nexou.png"
          alt="Logo Nexo"
          class="menu-lateral-logo"
        />
      </header>

      <nav class="menu-lateral-navegacion">
        <ul class="menu-lateral-lista">
          <li class="menu-lateral-item">
            <a href="./inicio.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-inicio.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Inicio</p>
            </a>
          </li>
          <li class="menu-lateral-item menu-lateral-item-activo">
            <a href="./recursos-biblioteca.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-libro-cerrado.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Biblioteca</p>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a href="./recursos-tecnologicos.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-laptop.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Tecnología</p>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a
              href="./mis-reservas.html"
              class="menu-lateral-enlace menu-lateral-enlace-con-notificacion"
            >
              <img
                src="/src/images/icono-calendario.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Reservas</p>
              <strong class="menu-lateral-notificacion">3</strong>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a href="./perfil.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-perfil.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Perfil</p>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a href="./soporte.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-soporte.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Soporte</p>
            </a>
          </li>
        </ul>
      </nav>

      <footer class="menu-lateral-pie">
        <figure class="menu-lateral-usuario-actual">
          <img
            src="/src/images/imagen-perfil.png"
            alt="Avatar de perfil"
            class="menu-lateral-usuario-avatar"
          />
          <figcaption class="menu-lateral-usuario-info">
            <p class="menu-lateral-usuario-nombre">Maria E. Gónzalez</p>
            <p class="menu-lateral-usuario-rol">Estudiante activo</p>
          </figcaption>
        </figure>

       <a href="../../index.html" class="menu-lateral-cerrar-sesion">
                <img src="/src/images/icono-cerrar-sesion.png" alt="" class="menu-lateral-icono-cerrar-sesion">
                <p class="menu-lateral-cerrar-sesion-parrafo">Cerrar Sesión</p>
            </a>
      </footer>
    </aside>

    <main class="contenido-principal">
      <header class="biblioteca-cabecera">
        <div class="biblioteca-cabecera-texto">
          <h1 class="biblioteca-titulo">Catálogo de Biblioteca</h1>
          <p class="biblioteca-subtitulo">Explora nuestra colección de libros académicos y recursos de estudio</p>
        </div>
      </header>

      <section class="biblioteca-controles">
        <div class="biblioteca-buscador">
          <img src="/src/images/icono-buscar-gris.png" alt="" class="buscador-icono" />
          <input
            type="text"
            placeholder="Buscar por título, autor o ISBN..."
            class="buscador-input"
          />
        </div>
        <div class="biblioteca-filtro-categoria">
          <img src="/src/images/icono-filtro-gris.png" alt="" class="filtro-icono" />
          <select class="filtro-select">
            <option value="todos">Todas las categorías</option>
            <option value="libros">Libros</option>
            <option value="articulos">Artículos</option>
            <option value="revistas">Revistas</option>
          </select>
        </div>
      </section>

      <p class="biblioteca-contador">Cargando recursos...</p>

      <section class="biblioteca-catalogo">
        <!-- Tarjetas generadas dinámicamente desde recursos-biblioteca.js -->
      </section>
    </main>
    <script src="/src/js/recursos-biblioteca.js"></script>
  </body>
</html>
