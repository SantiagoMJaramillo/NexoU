<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tecnología - NexoU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/css/recursos-tecnologicos.css" />
  </head>
  <body>
    <aside class="menu-lateral">
      <header class="menu-lateral-cabecera">
        <img
          src="/src/images/logo-nexou.png"
          alt="Logo Nexo"
          class="menu-lateral-logo"
        />
      </header>

      <nav class="menu-lateral-navegacion">
        <ul class="menu-lateral-lista">
          <li class="menu-lateral-item">
            <a href="./inicio.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-inicio.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Inicio</p>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a href="./recursos-biblioteca.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-libro-cerrado.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Biblioteca</p>
            </a>
          </li>
          <li class="menu-lateral-item menu-lateral-item-activo">
            <a href="./recursos-tecnologicos.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-laptop.png"
                alt=""
                class="menu-lateral-icono-tecnologia"
              />
              <p>Tecnología</p>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a
              href="./mis-reservas.html"
              class="menu-lateral-enlace menu-lateral-enlace-con-notificacion"
            >
              <img
                src="/src/images/icono-calendario.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Reservas</p>
              <strong class="menu-lateral-notificacion">3</strong>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a href="./perfil.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-perfil-dos.png"
                alt=""
                class="menu-lateral-icono-perfil"
              />
              <p>Perfil</p>
            </a>
          </li>
          <li class="menu-lateral-item">
            <a href="./soporte.html" class="menu-lateral-enlace">
              <img
                src="/src/images/icono-soporte.png"
                alt=""
                class="menu-lateral-icono"
              />
              <p>Soporte</p>
            </a>
          </li>
        </ul>
      </nav>

      <footer class="menu-lateral-pie">
        <figure class="menu-lateral-usuario-actual">
          <img
            src="/src/images/imagen-perfil.png"
            alt="Avatar de perfil"
            class="menu-lateral-usuario-avatar"
          />
          <figcaption class="menu-lateral-usuario-info">
            <p class="menu-lateral-usuario-nombre">Maria E. Gónzalez</p>
            <p class="menu-lateral-usuario-rol">Estudiante activo</p>
          </figcaption>
        </figure>

        <a href="../../index.html" class="menu-lateral-cerrar-sesion">
          <img
            src="/src/images/icono-cerrar-sesion.png"
            alt=""
            class="menu-lateral-icono-cerrar-sesion"
          />
          <p class="menu-lateral-cerrar-sesion-parrafo">Cerrar Sesión</p>
        </a>
      </footer>
    </aside>

    <main class="contenido-principal">
      <header class="contenido-principal-cabecera">
        <h1 class="contenido-cabecera-titulo">Recursos Tecnológicos</h1>
        <p class="contenido-cabecera-subtitulo">
          Equipos tecnológicos disponibles para uso académico y proyectos
        </p>

        <section class="contenido-principal-cabecera-controles">
          <label class="contenido-principal-buscador">
            <img
              src="/src/images/icono-buscar-gris.png"
              alt=""
              class="contenido-principal-buscador-icono"
            />
            <input
              type="text"
              placeholder="Buscar equipos por nombre o especificaciones..."
              class="contenido-principal-buscador-input"
            />
          </label>

          <button class="contenido-principal-filtro-dropdown">
            <img
              src="/src/images/icono-filtro-gris.png"
              alt=""
              class="contenido-principal-filtro-dropdown-icono"
            />
            <p class="contenido-principal-filtro-dropdown-texto">
              Todas las categorias
            </p>
          </button>
        </section>
      </header>

      <section class="contenido-principal-estadisticas">
        <article class="estadistica-card">
          <img
            src="/src/images/icono-laptop.png"
            alt=""
            class="estadistica-card-icono"
          />
          <p class="estadistica-card-numero">0</p>
          <p class="estadistica-card-texto">Laptops</p>
        </article>

        <article class="estadistica-card">
          <img
            src="/src/images/icono-tablet.png"
            alt=""
            class="estadistica-card-icono"
          />
          <p class="estadistica-card-numero">0</p>
          <p class="estadistica-card-texto">Tablets</p>
        </article>

        <article class="estadistica-card">
          <img
            src="/src/images/icono-proyector.png"
            alt=""
            class="estadistica-card-icono"
          />
          <p class="estadistica-card-numero">0</p>
          <p class="estadistica-card-texto">Proyectores</p>
        </article>

        <article class="estadistica-card">
          <img
            src="/src/images/icono-cpu.png"
            alt=""
            class="estadistica-card-icono"
          />
          <p class="estadistica-card-numero">0</p>
          <p class="estadistica-card-texto">Total Disponible</p>
        </article>
      </section>

      <section class="contenido-principal-informacion">
        <p class="contenido-principal-informacion-texto">
          Cargando equipos...
        </p>
      </section>

      <section class="contenido-principal-equipos">
        <!-- Tarjetas generadas dinámicamente desde recursos-tecnologicos.js -->
      </section>
    </main>
    <script src="/src/js/recursos-tecnologicos.js"></script>
  </body>
</html>
